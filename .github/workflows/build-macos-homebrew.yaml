name: build-macos-homebrew
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.nix'
      - 'flake.lock'
  pull_request:
    paths-ignore:
      - '**.nix'
      - 'flake.lock'

concurrency: ci-macos-homebrew-${{ github.ref }}

jobs:

  macos-homebrew:

    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} (using ${{ matrix.blas }})

    strategy:
      # Allow other runners in the matrix to continue if some fail
      fail-fast: false

      matrix:
        os: [macos-14]
        blas: [openblas, accelerate]
        # Homebrew publishes no Intel macOS bottle for vtk: as of vtk 9.7.0 the
        # bottles are arm64_tahoe, arm64_sequoia, arm64_sonoma, arm64_linux and
        # x86_64_linux only. "brew install vtk" therefore fails on
        # macos-15-intel with "vtk: no bottle available!", which fails the whole
        # dependency step. Building it from source would dominate the job, so
        # the Intel runner builds without VtkPost instead.
        #
        # This also switches WITH_OCC off, because ElmerGUI/CMakeLists.txt:111
        # sets WITH_VTK back to TRUE whenever WITH_OCC is on, which makes
        # FIND_PACKAGE(VTK REQUIRED) at :145 fail even with -DWITH_VTK=OFF.
        # See #895; if that is changed, the Intel runner can keep OpenCASCADE.
        vtk: [true]
        include:
          - os: macos-15-intel
            blas: openblas
            vtk: false

    steps:
      - name: get CPU information
        run: |
          sysctl hw
          sysctl machdep

      - name: checkout repository
        uses: actions/checkout@v7

      - name: install dependencies

        # Homebrew's Python conflicts with the Python that comes pre-installed
        # on the GitHub runners. Some of the dependencies depend on different
        # versions of Homebrew's Python. Enforce using the ones from Homebrew
        # to avoid errors on updates.
        # See: https://github.com/orgs/Homebrew/discussions/3928

        # It looks like "gfortran" isn't working correctly unless "gcc" is
        # re-installed.
        run: |
          brew update
          brew install --overwrite python@3.12 python@3.13
          brew reinstall gcc
          brew install \
            cmake \
            ${{ matrix.blas == 'openblas' && 'openblas' || '' }} \
            ${{ matrix.blas == 'accelerate' && 'veclibfort' || '' }} \
            open-mpi \
            libomp suitesparse \
            qwt ${{ matrix.vtk && 'vtk' || '' }} opencascade expat
          echo "HOMEBREW_PREFIX=$(brew --prefix)" >> $GITHUB_ENV

      - name: configure
        env:
          LDFLAGS: ${{ format('-L{0}/opt/libomp/lib -lomp', env.HOMEBREW_PREFIX) }}
        # SD_H1BasisEvaluation and SD_LinearFormsAssembly used to fail on
        # macos-15-intel (Intel CPU) at `-O3` (passed at `-O2`): the same
        # GaussPointsAdapt SAVE-state race noted above (LinearFormsAssembly
        # calls GaussPoints(...,PReferenceElement=.TRUE.) from every OMP
        # thread), with -O3 inlining/scheduling changing the odds of hitting
        # the race window. Fixed; back to Release/-O3.
        run: |
          if [ "x${{ matrix.blas }}" == "xaccelerate" ]; then
            export VECLIBFORT_PREFIX=$(brew --prefix veclibfort)
          fi
          mkdir ${GITHUB_WORKSPACE}/build
          cd ${GITHUB_WORKSPACE}/build
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_Fortran_COMPILER=gfortran \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/usr" \
            ${{ matrix.blas == 'openblas' && '-DBLA_VENDOR="OpenBLAS"' || '' }} \
            ${{ matrix.blas == 'accelerate'
              && '-DBLAS_LIBRARIES="${VECLIBFORT_PREFIX}/lib/libvecLibFort.dylib" \
                  -DLAPACK_LIBRARIES="${VECLIBFORT_PREFIX}/lib/libvecLibFort.dylib"' || '' }} \
            -DUSE_MACOS_PACKAGE_MANAGER=OFF \
            -DCMAKE_PREFIX_PATH="${HOMEBREW_PREFIX}/opt/libomp;${HOMEBREW_PREFIX}/opt/openblas;${HOMEBREW_PREFIX}/opt/qt;${HOMEBREW_PREFIX}/opt/qwt" \
            -DWITH_OpenMP=ON \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I${HOMEBREW_PREFIX}/opt/libomp/include" \
            -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I${HOMEBREW_PREFIX}/opt/libomp/include" \
            -DOpenMP_Fortran_FLAGS="-fopenmp -I${HOMEBREW_PREFIX}/opt/libomp/include" \
            -DWITH_LUA=ON \
            -DWITH_MPI=ON \
            -DMPI_TEST_MAXPROC=2 \
            -DWITH_Zoltan=OFF \
            -DWITH_Mumps=OFF \
            -DWITH_CHOLMOD=ON \
            -DWITH_ElmerIce=ON \
            -DWITH_ELMERGUI=ON \
            -DWITH_QT6=ON \
            -DQWT_INCLUDE_DIR="${HOMEBREW_PREFIX}/opt/qwt/lib/qwt.framework/Headers" \
            -DWITH_VTK=${{ matrix.vtk && 'ON' || 'OFF' }} \
            -DEXPAT_INCLUDE_DIR="${HOMEBREW_PREFIX}/opt/expat/include" \
            -DWITH_OCC=${{ matrix.vtk && 'ON' || 'OFF' }} \
            -DWITH_MATC=ON \
            -DWITH_PARAVIEW=ON \
            -DCREATE_PKGCONFIG_FILE=ON \
            ..

      - name: build
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --build . -j$(sysctl -n hw.logicalcpu)

      - name: install
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --install .

      - name: check
        id: run-ctest
        timeout-minutes: 150
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd ${GITHUB_WORKSPACE}/build
          ctest . \
            -LE slow \
            --timeout 600

#           -j$(sysctl -n hw.logicalcpu) \

      - name: re-run tests
        if: always() && (steps.run-ctest.outcome == 'failure')
        timeout-minutes: 60
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd ${GITHUB_WORKSPACE}/build
          # get names of failed tests and strip potential "_np*" suffix
          failed_tests=($(ctest . -N --rerun-failed | grep -E "Test\s+#.*" | awk '{print $3}' | sed -e 's/_np[0-9]*$//g'))
          # remove duplicate test names
          unique_failed_tests=($(echo "${failed_tests[@]}" | tr ' ' '\n' | sort -u | tr '\n' ' '))
          for test in "${unique_failed_tests[@]}"; do
            # check if test is from fem or ElmerIce
            if [ -d fem/tests/${test} ]; then
              test_root=fem/tests
            else
              test_root=elmerice/Tests
            fi
            echo "::group::Content of ${test_root}/${test}"
            echo ---- Files ----
            ls -Rl ${test_root}/${test}
            err_logs=($(ls ${test_root}/${test}/test-stderr*.log 2>/dev/null))
            for err_log in "${err_logs[@]}"; do
              echo ---- Content of ${err_log} ----
              cat ${err_log}
            done
            out_logs=($(ls ${test_root}/${test}/test-stdout*.log 2>/dev/null))
            for out_log in "${out_logs[@]}"; do
              echo ---- Content of ${out_log} ----
              cat ${out_log}
            done
            echo "::endgroup::"
          done
          echo "::group::Re-run failing tests"
          ctest --rerun-failed --output-on-failure --timeout 180 || true
          echo "::endgroup::"
          echo "::group::Log from these tests"
          [ ! -f Testing/Temporary/LastTest.log ] || cat Testing/Temporary/LastTest.log
          echo "::endgroup::"
