name: ubuntu-clang-full
on:
  workflow_dispatch:
  schedule:
    # Run job every Thursday at 09:50 UTC
    - cron: '50 09 * * 4'

concurrency: ci-ubuntu-clang-full-${{ github.ref }}

jobs:

  ubuntu:
    # For available GitHub-hosted runners, see:
    # https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners
    runs-on: ubuntu-latest

    name: ubuntu-full (${{ matrix.compiler }})

    strategy:
      # Allow other runners in the matrix to continue if some fail
      fail-fast: false

      matrix:
        compiler: [clang]
        include:
          - compiler: clang
            compiler-pkgs: "clang"
            cc: "clang"
            cxx: "clang++"
            # OpenMP is deliberately OFF here, and now says so explicitly.
            #
            # This used to read "-WITH_OpenMP=ON -DOpenMP_C_FLAGS=... " but the
            # first flag lacks its -D, and cmake silently ignores an unknown -W
            # argument (exit 0, no warning), so WITH_OpenMP kept its FALSE
            # default and the OpenMP_*_FLAGS were inert. The job has therefore
            # never built with OpenMP, despite appearing to ask for it.
            #
            # Simply adding the missing -D would break the build: the runner
            # image has no libomp, so FIND_PACKAGE(OpenMP REQUIRED) hard-fails
            # with "Could NOT find OpenMP_C (missing: OpenMP_C_LIB_NAMES)".
            # Clang has to be pointed at GCC's libgomp instead, and note that
            # -fopenmp=libgomp does NOT define _OPENMP, so without forcing it
            # every "#ifdef _OPENMP" block in C/C++ would silently compile out
            # while OpenMP looked enabled. A recipe verified to configure:
            #
            #   -DWITH_OpenMP=ON
            #   -DOpenMP_C_FLAGS='-fopenmp=libgomp -D_OPENMP=201511'
            #   -DOpenMP_CXX_FLAGS='-fopenmp=libgomp -D_OPENMP=201511'
            #   -DOpenMP_C_LIB_NAMES='gomp;pthread'
            #   -DOpenMP_CXX_LIB_NAMES='gomp;pthread'
            #
            # We keep it OFF: the point of this job is to test the clang C/C++
            # compiler difference against ubuntu-gcc-full, not to maintain a
            # second, clang-specific OpenMP setup. OpenMP coverage comes from
            # ubuntu-gcc-full and from the build.yaml matrix.
            openmp-cmake-flags: "-DWITH_OpenMP=OFF"

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - name: get CPU information
        run: lscpu

      - name: checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: remove broken Microsoft apt repositories
        run: sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list

      - name: install dependencies
        run: |
          sudo apt -qq update
          sudo apt install -y ${{ matrix.compiler-pkgs }} cmake gfortran \
            libopenblas-dev libopenmpi-dev libmumps-dev libparmetis-dev \
            libqwt-qt5-dev qtscript5-dev libqt5svg5-dev

      - name: configure
        run: |
          mkdir ${GITHUB_WORKSPACE}/build
          cd ${GITHUB_WORKSPACE}/build
          cmake \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/usr" \
            -DBLA_VENDOR="OpenBLAS" \
            ${{ matrix.openmp-cmake-flags }} \
            -DWITH_LUA=ON \
            -DWITH_Zoltan=ON \
            -DWITH_Mumps=ON \
            -DWITH_ElmerIce=ON \
            -DWITH_ELMERGUI=ON \
            -DWITH_PARAVIEW=ON \
            -DCREATE_PKGCONFIG_FILE=ON \
            -DWITH_MPI=ON \
            -DMPI_TEST_MAXPROC=2 \
            -DMPIEXEC_PREFLAGS="--allow-run-as-root" \
            ..

      - name: build
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --build . -j$(nproc)

      - name: install
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --install .

      - name: check
        id: run-ctest
        timeout-minutes: 150
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd ${GITHUB_WORKSPACE}/build
          ctest . -j$(nproc)

      - name: re-run tests
        if: always() && (steps.run-ctest.outcome == 'failure')
        timeout-minutes: 60
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd ${GITHUB_WORKSPACE}/build
          # get names of failed tests and strip potential "_np*" suffix
          failed_tests=($(ctest . -N --rerun-failed | grep -E "Test\s+#.*" | awk '{print $3}' | sed -e 's/_np[0-9]*$//g'))
          # remove duplicate test names
          unique_failed_tests=($(echo "${failed_tests[@]}" | tr ' ' '\n' | sort -u | tr '\n' ' '))
          for test in "${unique_failed_tests[@]}"; do
            # check if test is from fem or ElmerIce
            if [ -d fem/tests/${test} ]; then
              test_root=fem/tests
            else
              test_root=elmerice/Tests
            fi
            echo "::group::Content of ${test_root}/${test}"
            echo ---- Files ----
            ls -Rl ${test_root}/${test}
            err_logs=($(ls ${test_root}/${test}/test-stderr*.log 2>/dev/null))
            for err_log in "${err_logs[@]}"; do
              echo ---- Content of ${err_log} ----
              cat ${err_log}
            done
            out_logs=($(ls ${test_root}/${test}/test-stdout*.log 2>/dev/null))
            for out_log in "${out_logs[@]}"; do
              echo ---- Content of ${out_log} ----
              cat ${out_log}
            done
            echo "::endgroup::"
          done
          echo "::group::Re-run failing tests"
          ctest --rerun-failed --output-on-failure || true
          echo "::endgroup::"
          echo "::group::Log from these tests"
          [ ! -f Testing/Temporary/LastTest.log ] || cat Testing/Temporary/LastTest.log
          echo "::endgroup::"
