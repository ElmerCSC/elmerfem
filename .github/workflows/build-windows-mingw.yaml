name: build-windows-mingw
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.nix'
      - 'flake.lock'
  pull_request:
    paths-ignore:
      - '**.nix'
      - 'flake.lock'

concurrency: ci-windows-mingw-${{ github.ref }}

jobs:

  windows-mingw:

    runs-on: windows-latest

    name: MSYS2 (${{ matrix.msystem }} ${{ matrix.mpi }} MPI, ${{ matrix.dependencies }} dependencies)

    defaults:
      run:
        shell: msys2 {0}

    strategy:
      # Allow other runners in the matrix to continue if some fail
      fail-fast: false

      matrix:
        msystem: [UCRT64]
        dependencies: [bundled, external]
        mpi: [with, without]
        include:
          - dependencies: external
            external-packages: parpack:p metis:p
            external-cmake-flags: -DEXTERNAL_UMFPACK=ON -DEXTERNAL_ARPACK=ON -DEXTERNAL_PARPACK=ON -DEXTERNAL_METIS=ON

    steps:
      - name: get CPU name
        shell: pwsh
        run : |
          Get-CIMInstance -Class Win32_Processor | Select-Object -Property Name

      - name: checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: unshallow Zoltan submodule
        shell: bash
        run: git -C contrib/Zoltan_v3.83 fetch --unshallow 2>/dev/null || true

      - name: install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            base-devel
            git
          pacboy: >-
            cc:p
            fc:p
            cmake:p
            ${{ matrix.mpi == 'with' && 'msmpi:p' || 'openblas:p' }}
            openblas:p
            ${{ matrix.mpi == 'with' && 'parmetis:p' || 'openblas:p' }}
            mumps:p
            suitesparse:p
            qt6-declarative:p
            qwt-qt6:p
            vtk:p
            adios2:p
            anari-sdk:p 
            boost:p
            cgns:p
            cli11:p
            eigen3:p
            exprtk:p
            fast_float:p
            ffmpeg:p
            gl2ps:p
            liblas:p
            libmariadbclient:p
            netcdf:p 
            openslide:p
            openvdb:p
            pdal:p
            scnlib:p
            seacas:p
            unixodbc:p
            utf8cpp:p
            opencascade:p
            nlohmann-json:p
            ${{ matrix.external-packages }}
            ${{ matrix.dependencies == 'bundled' && 'nsis:p ntldd:p' || '' }}

      - name: install MSMPI
        if: matrix.mpi == 'with'
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: msmpi

      - name: configure
        # Downgrade incompatible-pointer-types to a warning to work around
        # build error of Zoltan with newer GCC.
        run: |
          mkdir ${GITHUB_WORKSPACE}/build
          cd ${GITHUB_WORKSPACE}/build
          declare -a _extra_config
          if [ "${{ matrix.mpi }}" == "with" ]; then
            _extra_config+=("-DWITH_MPI=ON"
                            "-DMPI_TEST_MAXPROC=$(nproc)"
                            "-DMPIEXEC_EXECUTABLE=$(cygpath -m "${MSMPI_BIN}")/mpiexec.exe"
                            "-DWITH_Zoltan=ON"
                            "-DWITH_ElmerIce=ON"
                            "-DParMetis_LIBRARIES=$(pkg-config --libs parmetis)"
                            "-DParMetis_INCLUDE_DIR=$(pkg-config --cflags parmetis)"
                            "-DWITH_Mumps=ON"
                            "-DMumps_LIBRARIES=$(pkg-config --libs mumps-dmo mumps-zmo mumps-smo mumps-cmo)"
                            "-DMumps_INCLUDE_DIR=$(pkg-config --variable=includedir mumps-dmo)")
          else
            _extra_config+=("-DWITH_MPI=OFF"
                            "-DWITH_Zoltan=OFF"
                            "-DWITH_ElmerIce=OFF"
                            "-DWITH_Mumps=ON"
                            "-DMumps_LIBRARIES=$(pkg-config --libs mumps-dto mumps-zto mumps-sto mumps-cto)"
                            "-DMumps_INCLUDE_DIR=$(pkg-config --variable=includedir mumps-dto)")
          fi
          if [ "${{ matrix.dependencies }}" == "bundled" ]; then
            SANITIZED_REF_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^A-Za-z0-9._-]/_/g')
            # add flags for creating a bundle with CPack
            _extra_config+=("-DCPACK_PACKAGE_BASE_FILE_NAME=elmerfem-${{ matrix.mpi == 'with' && 'mpi' || 'nompi' }}-${SANITIZED_REF_NAME}"
                            "-DCPACK_BUNDLE_EXTRA_WINDOWS_DLLS=ON"
                            "-DBUNDLE_STRIPPED_GFORTRAN=OFF")
            if [ "${{ matrix.mpi }}" == "with" ]; then
              _extra_config+=("-DBUNDLE_MSMPI_REDIST=ON")
            fi
          else
            _extra_config+=("-DCPACK_BUNDLE_EXTRA_WINDOWS_DLLS=OFF")
          fi
          cmake \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/usr" \
            "${_extra_config[@]}" \
            -DBLA_VENDOR="OpenBLAS" \
            -DWITH_OpenMP=ON \
            -DWITH_LUA=ON \
            -DCMAKE_C_FLAGS="-Wno-error=incompatible-pointer-types" \
            -DWITH_ELMERGUI=ON \
            -DWITH_QT6=ON \
            -DWITH_VTK=ON \
            -DWITH_OCC=ON \
            -DWITH_MATC=ON \
            -DWITH_PARAVIEW=ON \
            -DCREATE_PKGCONFIG_FILE=ON \
            ${{ matrix.external-cmake-flags }} \
            ..

      - name: exclude build output from Windows Defender scanning
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: build
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --build .

      - name: create bundles
        if: matrix.dependencies == 'bundled'
        id: create-bundles
        run: |
          if [ "${{ matrix.mpi }}" == "with" ]; then
            # copy MSMPI installer to a location where it can be found
            mkdir ${GITHUB_WORKSPACE}/../msmpi_redist
            cp "$(cygpath -m "${MSMPI_BIN}")/../Redist/MSMpiSetup.exe" "${GITHUB_WORKSPACE}/../msmpi_redist/"
          fi
          # create bundles
          cd ${GITHUB_WORKSPACE}/build
          cpack -G "ZIP;NSIS64" .
          # store name of bundle for following steps
          cmake -LA -N .. | awk -F= '$1~/CPACK_PACKAGE_FILE_NAME:STRING/{print "bundle-name="$2}' >> $GITHUB_OUTPUT

      - name: upload installer
        if: matrix.dependencies == 'bundled'
        uses: actions/upload-artifact@v7
        with:
          name: elmerfem-${{ matrix.mpi == 'with' && 'mpi' || 'nompi' }}-installer
          path: ${{ github.workspace }}/build/${{ steps.create-bundles.outputs.bundle-name }}.exe
          archive: false

      - name: upload zip archive
        if: matrix.dependencies == 'bundled'
        uses: actions/upload-artifact@v7
        with:
          name: elmerfem-${{ matrix.mpi == 'with' && 'mpi' || 'nompi' }}-zip
          path: ${{ github.workspace }}/build/${{ steps.create-bundles.outputs.bundle-name }}.zip
          archive: false

      - name: install
        run: |
          cd ${GITHUB_WORKSPACE}/build
          cmake --install .

      - name: check
        id: run-ctest
        timeout-minutes: 150
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd ${GITHUB_WORKSPACE}/build
          ctest . \
            -LE slow \
            --timeout 600

      - name: re-run tests
        if: always() && (steps.run-ctest.outcome == 'failure')
        timeout-minutes: 60
        env:
          CTEST_OUTPUT_ON_FAILURE: 1
        run: |
          cd ${GITHUB_WORKSPACE}/build
          # get names of failed tests and strip potential "_np*" suffix
          failed_tests=($(ctest . -N --rerun-failed | grep -E "Test\s+#.*" | awk '{print $3}' | sed -e 's/_np[0-9]*$//g'))
          # remove duplicate test names
          unique_failed_tests=($(echo "${failed_tests[@]}" | tr ' ' '\n' | sort -u | tr '\n' ' '))
          for test in "${unique_failed_tests[@]}"; do
            # check if test is from fem or ElmerIce
            if [ -d fem/tests/${test} ]; then
              test_root=fem/tests
            else
              test_root=elmerice/Tests
            fi
            echo "::group::Content of ${test_root}/${test}"
            echo ---- Files ----
            ls -Rl ${test_root}/${test}
            if [ -f ${test_root}/${test}/test-stderr*.log ]; then
              err_logs=($(ls ${test_root}/${test}/test-stderr*.log))
              for err_log in "${err_logs[@]}"; do
                echo ---- Content of ${err_log} ----
                cat ${err_log}
              done
            fi
            if [ -f ${test_root}/${test}/test-stdout*.log ]; then
              out_logs=($(ls ${test_root}/${test}/test-stdout*.log))
              for out_log in "${out_logs[@]}"; do
                echo ---- Content of ${out_log} ----
                cat ${out_log}
              done
            fi
            echo "::endgroup::"
          done
          echo "::group::Re-run failing tests"
          ctest --rerun-failed --output-on-failure --timeout 180 || true
          echo "::endgroup::"
          echo "::group::Log from these tests"
          [ ! -f Testing/Temporary/LastTest.log ] || cat Testing/Temporary/LastTest.log
          echo "::endgroup::"
